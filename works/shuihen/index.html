<style>
/* layout: full-bleed concrete plaza on canvas; chalk-written tag top-left; chalk-outlined control strip along the bottom */
:root{
  --chalk:#f7f4ea;
  --chalk-dim:rgba(247,244,234,.74);
  --chalk-line:rgba(247,244,234,.62);
  --scrim:rgba(38,34,29,.38);
  --scrim-on:rgba(247,244,234,.9);
  --ink:#2a2620;
  --ground:#8f897e;
  --font-chalk:"LXGW WenKai TC","Kaiti TC","BiauKai","STKaiti","DFKai-SB",serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--chalk);font-family:var(--font-chalk);overflow:hidden;-webkit-user-select:none;user-select:none}
#plaza{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:crosshair}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
.tag{display:grid;gap:2px;text-shadow:0 1px 0 rgba(0,0,0,.25),0 0 6px rgba(0,0,0,.18)}
.no{font-size:30px;font-weight:700;letter-spacing:.06em;line-height:1.1}
.nm{font-size:19px;line-height:1.3;min-height:1.3em}
.ph{min-height:1.4em}
.ph{font-size:14px;color:var(--chalk-dim);letter-spacing:.12em}
.foot{display:grid;gap:10px;justify-items:start}
.hint{font-size:15px;color:var(--chalk-dim);text-shadow:0 1px 2px rgba(0,0,0,.3);transition:opacity .8s}
.hint.gone{opacity:0}
.bar{pointer-events:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;gap:0}
button{font:inherit;font-size:16px;color:var(--chalk);background:var(--scrim);border:1.5px solid var(--chalk-line);
  border-radius:3px 6px 4px 5px;padding:7px 13px;cursor:pointer;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  min-height:40px;font-variant-numeric:tabular-nums}
button:hover{border-color:var(--chalk)}
.btnlink{box-sizing:border-box;display:inline-flex;align-items:center;font:inherit;font-size:16px;color:var(--chalk);background:var(--scrim);border:1.5px solid var(--chalk-line);border-radius:3px 6px 4px 5px;padding:7px 13px;min-height:40px;text-decoration:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
button:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.seg button{border-radius:0}
.seg button:first-child{border-radius:4px 0 0 5px}
.seg button:last-child{border-radius:0 5px 4px 0}
.seg button+button{border-left-width:0}
.seg button[aria-pressed="true"]{background:var(--scrim-on);color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,18,15,.5);display:grid;place-items:start center;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.card{width:min(460px,100%);margin:auto 0;display:grid;grid-template-rows:auto auto auto auto;gap:12px;
  background:rgba(40,36,30,.94);border:1.5px solid var(--chalk-line);border-radius:4px 7px 5px 6px;padding:16px;box-sizing:border-box}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:14px;min-height:34px;padding:5px 10px;border-radius:14px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.chips button[aria-pressed="true"]{background:var(--scrim-on);color:var(--ink);border-color:var(--scrim-on)}
.chips .k{opacity:.7;margin-left:4px;font-size:12px}
.list .g{font-size:12px;color:var(--chalk-dim);margin-left:6px;font-weight:400}
.share-card{grid-template-rows:auto auto auto auto}
.origin-img{display:block;width:100%;height:auto;max-height:60vh;object-fit:cover;border-radius:3px;border:1px solid var(--chalk-line)}
.origin-t{margin:0;font-size:16px;line-height:1.6}
.origin-s{margin:0;font-size:13px;color:var(--chalk-dim)}
.share-t{margin:0;font-size:18px;font-weight:700}
.share-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share-grid a,.share-grid button{display:flex;align-items:center;justify-content:center;min-height:44px;font:inherit;font-size:16px;color:var(--chalk);text-decoration:none;
  background:var(--scrim);border:1.5px solid var(--chalk-line);border-radius:4px;padding:8px}
.share-grid a:hover,.share-grid button:hover{border-color:var(--chalk)}
#share-url{font:inherit;font-size:13px;color:var(--chalk-dim);background:transparent;border:0;border-bottom:1.5px solid var(--chalk-line);padding:6px 2px;min-width:0;width:100%}
.card header{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-16px;z-index:2;background:rgb(40,36,30);margin:-16px -16px 0;padding:16px 16px 8px}
.card h2{margin:0;font-size:22px;letter-spacing:.08em}
.card input{font:inherit;font-size:17px;color:var(--chalk);background:transparent;border:0;border-bottom:1.5px solid var(--chalk-line);padding:8px 2px;min-width:0}
.card input:focus-visible{outline:none;border-bottom-color:var(--chalk)}
.card input::placeholder{color:var(--chalk-dim)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px;align-content:start}
.list button{width:100%;text-align:left;display:grid;gap:3px;border-radius:3px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.list button[aria-current="true"]{border-color:var(--chalk);background:rgba(247,244,234,.1)}
.list .t{font-size:18px;font-weight:700}
.list .c{font-size:14px;color:var(--chalk-dim);line-height:1.45}
.list mark{background:rgba(247,244,234,.85);color:var(--ink);border-radius:2px;padding:0 1px}
.empty{color:var(--chalk-dim);font-size:15px;padding:6px 2px}
</style>

</head>
<body>
<canvas id="plaza" aria-label="老水泥廣場，一條水管流出的水在地上形成各種造型"></canvas>
<div class="hud">
  <div class="tag" aria-live="polite">
    <div class="no" id="no">第 1 灘</div>
    <div class="nm" id="nm"></div>
    <div class="ph" id="ph">水管移過去</div>
  </div>
  <div class="foot">
    <div class="hint" id="hint">四格故事：水管一格一格畫，畫完一起曬乾</div>
    <div class="bar">
      <button id="pause" type="button">暫停</button>
      <button id="pick" type="button">找故事</button>
      <button id="share" type="button">分享這則</button>
      <button id="next" type="button">換下一個</button>
      <button id="speed" type="button">速度 1×</button>
      <button id="sound" type="button" aria-pressed="false">開聲音</button>
      <button id="narr" type="button" aria-pressed="false">開旁白</button>
      <button id="origin" type="button">創作來源</button>
      <a id="narr-out" class="btnlink" href="https://p19691221-web.github.io/soft-shelf/works/shuihen/" target="_blank" rel="noopener" hidden>旁白：用瀏覽器開</a>
      <div class="seg" role="group" aria-label="模式">
        <button type="button" id="m-story" data-mode="story" aria-pressed="true">四格故事</button>
        <button type="button" id="m-free" data-mode="free" aria-pressed="false">自由</button>
      </div>
      <div class="seg" id="catseg" role="group" aria-label="造型種類" hidden>
        <button type="button" id="c-all" data-cat="all" aria-pressed="true">全部</button>
        <button type="button" id="c-p" data-cat="p" aria-pressed="false">人物</button>
        <button type="button" id="c-o" data-cat="o" aria-pressed="false">其他</button>
      </div>
    </div>
  </div>
</div>

<div class="sheet" id="shareSheet" hidden>
  <div class="card share-card" role="dialog" aria-modal="true" aria-labelledby="share-title">
    <header><h2 id="share-title">分享這則</h2><button type="button" id="share-close">關閉</button></header>
    <p class="share-t" id="share-name"></p>
    <div class="share-grid">
      <a id="sh-line" target="_blank" rel="noopener">LINE</a>
      <a id="sh-threads" target="_blank" rel="noopener">Threads</a>
      <a id="sh-fb" target="_blank" rel="noopener">Facebook</a>
      <button type="button" id="sh-copy">複製連結</button>
    </div>
    <input id="share-url" type="text" readonly aria-label="故事連結">
  </div>
</div>
<div class="sheet" id="originSheet" hidden>
  <div class="card origin-card" role="dialog" aria-modal="true" aria-labelledby="origin-title">
    <header><h2 id="origin-title">創作來源</h2><button type="button" id="origin-close">關閉</button></header>

<script>
(()=>{
const cv=document.getElementById('plaza'), ctx=cv.getContext('2d');
const bg=document.createElement('canvas');

const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

/* ---------- noise ---------- */
function makeNoise(){const S=256,t=new Float32Array(S*S);for(let i=0;i<t.length;i++)t[i]=Math.random();
  return (x,y)=>{const xi=Math.floor(x),yi=Math.floor(y);let xf=x-xi,yf=y-yi;xf=xf*xf*(3-2*xf);yf=yf*yf*(3-2*yf);
    const x0=xi&255,y0=yi&255,x1=(xi+1)&255,y1=(yi+1)&255;
    const a=t[x0+y0*S],b=t[x1+y0*S],c=t[x0+y1*S],d=t[x1+y1*S];
    return a+(b-a)*xf+(c-a)*yf+(a-b-c+d)*xf*yf;};}
const nz=makeNoise();
const fbm=(x,y)=>nz(x,y)*.6+nz(x*2.1+17,y*2.1+9)*.28+nz(x*4.3+3,y*4.3+41)*.12;

/* ---------- state ---------- */
let W=0,H=0,DPR=1,CELL=3,GW=0,GH=0,N=0;
let pool,skyR,skyG,skyB,acc,accDry,wet,stain,mask,arr,dryT,rough,gloss,depth,queue,heapI,heapK,wImg,sImg;

let round=null,queuedAt=null,paused=false,speedIdx=0,cat='all',lastName='';
const TTS=window.speechSynthesis||null;let narrOn=false;
const SPEEDS=[1,2,4];
const FLOW=50;
let parts=[];

/* ---------- shapes (unit space, centred, facing right) ---------- */
function cr(c,P){const n=P.length;c.moveTo(P[0][0],P[0][1]);
  for(let i=0;i<n;i++){const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    c.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]);}
  c.closePath();}
const fillE=(c,x,y,rx,ry,r=0)=>{c.beginPath();c.ellipse(x,y,rx,ry,r,0,Math.PI*2);c.fill();};
const fillP=(c,pts)=>{c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();c.fill();};
const cut=(c,fn)=>{c.globalCompositeOperation='destination-out';fn();c.globalCompositeOperation='source-over';};

const PV=[
  {id:'douli',name:'戴斗笠的阿伯'},{id:'cap',name:'戴鴨舌帽的少年'},{id:'bun',name:'綁髮髻的阿嬤'},
  {id:'pony',name:'綁馬尾的女孩'},{id:'beard',name:'留鬍子的阿公'},{id:'long',name:'長頭髮的人'},
  {id:'kid',name:'仰著頭的小孩'},{id:'flat',name:'理平頭的人'},{id:'plain',name:'路過的人'}
];
function profileShape(v){
  let nose=rand(-.01,.06),lip=rand(0,.02),chin=rand(-.04,.03),brow=rand(0,.025),fore=rand(-.03,.02);
  if(v.fixed){nose=.035;lip=.01;chin=0;brow=.012;fore=0;}
  const P=[[.30,1.10],[.27,.88],[.18,.72],[.10,.48],[.17,.20],[.40,.04],[.62,.08],[.72+fore,.24],[.76+brow,.38],[.745,.45],
    [.80+nose,.58],[.765,.63],[.785+lip,.69],[.76,.725],[.775+lip,.765],[.745,.80],[.765+chin,.88],[.66,.95],[.60,.98],[.60,1.10]];
  if(v.id==='kid'){P[10]=[.775,.58];P[16]=[.735,.87];P[7]=[.76,.25];P[3]=[.06,.46];P[4]=[.13,.16];P[5]=[.38,.0];P[8]=[.765,.38];}
  if(v.id==='flat'){P[4]=[.18,.13];P[5]=[.40,.07];P[6]=[.64,.07];}
  if(v.id==='long'){P[0]=[.26,1.12];P[1]=[.06,1.04];P[2]=[.04,.78];}
  return {name:v.name,kind:'p',core:v.core||[0,.02],box:v.box||[1.07,1.12],rot:v.id==='kid'?-.14:rand(-.04,.04),
    cut:v.cutP?(c=>{if(v.scale){c.translate(v.shift||0,0);c.scale(v.scale,v.scale);}c.translate(-.45,-.57);v.cutP(c);}):undefined,draw(c){
    if(v.scale){c.translate(v.shift||0,0);c.scale(v.scale,v.scale);}
    c.translate(-.45,-.57);if(v.extra)v.extra(c);
    c.beginPath();cr(c,P);c.fill();
    if(v.id==='bun'||v.bun){fillE(c,.12,.22,.125,.12);}
    if(v.id==='mom'){fillE(c,.12,.6,.11,.1);}
    if(v.id==='pony'){c.lineWidth=.1;c.beginPath();c.moveTo(.16,.30);c.quadraticCurveTo(-.08,.36,-.06,.68);c.stroke();fillE(c,.15,.30,.06,.06);}
    if(v.id==='cap'){fillE(c,.42,.18,.33,.16);fillP(c,[[.55,.12],[1.0,.18],[.99,.235],[.6,.25]]);}
    if(v.id==='douli'){fillP(c,[[-.16,.34],[.43,-.13],[1.02,.34],[.98,.37],[-.12,.37]]);
      c.lineWidth=.03;c.beginPath();c.moveTo(.70,.36);c.quadraticCurveTo(.76,.80,.62,.96);c.stroke();}
    if(v.id==='beard'){c.beginPath();cr(c,[[.79,.77],[.81,.90],[.73,1.05],[.58,1.07],[.50,.92],[.62,.84]]);c.fill();}
  }};
}

let chalk=null,chx=null,speck=null;
function buildChalk(){chalk=document.createElement('canvas');chalk.width=Math.round(W*DPR);chalk.height=Math.round(H*DPR);chx=chalk.getContext('2d');
  const t=document.createElement('canvas');t.width=t.height=96;const x=t.getContext('2d');
  for(let k=0;k<900;k++){x.fillStyle=`rgba(0,0,0,${Math.random().toFixed(2)})`;x.fillRect(Math.random()*96,Math.random()*96,1+Math.random()*1.4,1);}

function chalkLine(x1,y1,x2,y2,j){chx.beginPath();chx.moveTo(x1+j[0],y1+j[1]);chx.quadraticCurveTo((x1+x2)/2+j[2],(y1+y2)/2+j[3],x2+j[4],y2+j[5]);chx.stroke();}
function wrapChalk(t,x,y,maxW,lh){const lines=[];let cur='';
  for(const ch of t){if(cur&&!'，。！？、）」』：…'.includes(ch)&&chx.measureText(cur+ch).width>maxW){if(cur.endsWith('「')){lines.push(cur.slice(0,-1));cur='「'+ch;}else{lines.push(cur);cur=ch;}}else cur+=ch;}
  if(cur)lines.push(cur);
  if(lines.length>2){lines[1]=lines.slice(1).join('');}
  lines.slice(0,2).forEach((l,i)=>chx.fillText(l,x,y+i*lh,maxW));}
function drawChalkLayer(){

      chx.strokeStyle=col;chx.lineWidth=2.4;chx.save();chx.translate(o,o);
      chalkLine(p.x,p.y,p.x+p.w,p.y,j.slice(0,6));chalkLine(p.x+p.w,p.y,p.x+p.w,p.y+p.h,j.slice(6,12));
      chalkLine(p.x+p.w,p.y+p.h,p.x,p.y+p.h,j.slice(12,18));chalkLine(p.x,p.y+p.h,p.x,p.y,j.slice(18,24));
      chx.fillStyle=col;chx.font=`700 ${Math.round(fsz*1.1)}px ${face}`;chx.fillText(String(k+1),p.x+8,p.y+6);
      const a=story.capA[k];
      if(a>0){chx.globalAlpha=a;chx.font=`${Math.round(fsz)}px ${face}`;wrapChalk(story.S.panels[k][1],p.x+2,p.y+p.h+8,p.w-4,fsz*1.45);chx.globalAlpha=1;}
      chx.restore();}
  });

  chx.globalAlpha=1;chx.globalCompositeOperation='source-over';

/* ---------- render ---------- */
function render(){
  const r=round,ph=r.phase,F=r.F,wetting=ph==='flow'||ph==='hold';
  const standing=wetting?1:ph==='dry'?Math.max(.15,1-r.t/2.5):.15;
  const wd=wImg.data,sd=sImg.data;
  for(let i=0,j=0;i<N;i++,j+=4){const w=wet[i];let d=w*.8+stain[i];
    if(w>.25){const x=i%GW;const l=x?wet[i-1]:w,rr=x<GW-1?wet[i+1]:w,u=i>=GW?wet[i-GW]:w,dn=i+GW<N?wet[i+GW]:w;
      if(Math.min(l,rr,u,dn)<.15)d+=.2;}
    if(d>1)d=1;
    wd[j]=255-d*150;wd[j+1]=255-d*141;wd[j+2]=255-d*126;wd[j+3]=255;
    let g=0;
    if(w>.05){g=w*standing*(.04+gloss[i]*.17);if(wetting){const f=F-arr[i];if(f>=0&&f<16)g+=(1-f/16)*.42*w;}}
    if(g>1)g=1;

    sd[j]=Math.min(255,g*206+rs*skyR[i]);sd[j+1]=Math.min(255,g*219+rs*skyG[i]);sd[j+2]=Math.min(255,g*232+rs*skyB[i]);sd[j+3]=255;}
  wctx.putImageData(wImg,0,0);sctx.putImageData(sImg,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';
  ctx.drawImage(bg,0,0,W,H);
  ctx.imageSmoothingEnabled=true;
  ctx.globalCompositeOperation='multiply';ctx.drawImage(wc,0,0,GW*CELL,GH*CELL);
  ctx.globalCompositeOperation='screen';ctx.drawImage(sc,0,0,GW*CELL,GH*CELL);
  ctx.globalCompositeOperation='source-over';
  drawChalkLayer();
  drawHose(wetting);
  for(const p of parts){const a=1-p.m/p.l;ctx.fillStyle=`rgba(238,245,250,${(a*.8).toFixed(3)})`;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();}
}
function drawHose(running){
  const ax=Math.cos(aimAng),ay=Math.sin(aimAng);

  ctx.fillStyle='#8f6d2f';ctx.fillRect(-2,-5.5,7,11);
  ctx.fillStyle='#c39d52';ctx.fillRect(4,-4.5,11,9);
  ctx.fillStyle='rgba(255,240,200,.5)';ctx.fillRect(4,-3.6,11,1.6);
  ctx.fillStyle='#7a5b26';ctx.fillRect(13,-4.8,2.5,9.6);
  if(running){const l=rand(9,15);ctx.strokeStyle='rgba(232,242,248,.75)';ctx.lineWidth=rand(3,4.5);ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(15+l,rand(-.8,.8));ctx.stroke();}

/* ---------- sound (all synthesized live) ---------- */
let AC=null,SN=null,soundOn=false;
function mkNoise(ac,kind){const len=ac.sampleRate*3,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='brown'){last=(last+.02*w)/1.02;d[i]=last*3.5;}else d[i]=w;}
  const s=ac.createBufferSource();s.buffer=b;s.loop=true;s.start(0,Math.random()*2);return s;}
function panner(ac,v){if(!ac.createStereoPanner)return ac.createGain();const p=ac.createStereoPanner();p.pan.value=v;return p;}
function initSound(){
  const ac=new (window.AudioContext||window.webkitAudioContext)();AC=ac;
  const master=ac.createGain(),comp=ac.createDynamicsCompressor();master.gain.value=0;master.connect(comp);comp.connect(ac.destination);
  // hose: two bands of hiss plus a spattering top layer
  const wn=mkNoise(ac,'white'),b1=ac.createBiquadFilter(),b2=ac.createBiquadFilter(),g1=ac.createGain(),g2=ac.createGain(),wg=ac.createGain();
  b1.type='bandpass';b1.frequency.value=1100;b1.Q.value=.9;b2.type='bandpass';b2.frequency.value=3200;b2.Q.value=1.2;
  g1.gain.value=.9;g2.gain.value=.4;wg.gain.value=0;
  wn.connect(b1);wn.connect(b2);b1.connect(g1);b2.connect(g2);g1.connect(wg);g2.connect(wg);wg.connect(master);
  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.37;lg.gain.value=180;lfo.connect(lg);lg.connect(b1.frequency);lfo.start();
  const sp=mkNoise(ac,'white'),hp=ac.createBiquadFilter(),spg=ac.createGain(),spOut=ac.createGain();
  hp.type='highpass';hp.frequency.value=4200;spg.gain.value=.12;spOut.gain.value=0;
  const mod=mkNoise(ac,'brown'),mg=ac.createGain();mg.gain.value=.3;mod.connect(mg);mg.connect(spg.gain);
  sp.connect(hp);hp.connect(spg);spg.connect(spOut);spOut.connect(master);
  // cicadas: bandpassed noise pulsed at a few dozen Hz
  const cicada=(f,rate,pan)=>{const n=mkNoise(ac,'white'),bp=ac.createBiquadFilter(),am=ac.createGain(),o=ac.createOscillator(),og=ac.createGain(),out=ac.createGain(),p=panner(ac,pan);
    bp.type='bandpass';bp.frequency.value=f;bp.Q.value=5;am.gain.value=.5;o.type='triangle';o.frequency.value=rate;og.gain.value=.5;
    o.connect(og);og.connect(am.gain);o.start();out.gain.value=.03;n.connect(bp);bp.connect(am);am.connect(out);out.connect(p);p.connect(master);return out;};
  const cic=[cicada(5400,46,-.5),cicada(6100,53,.6)];
  // distant town hum
  const an=mkNoise(ac,'brown'),al=ac.createBiquadFilter(),ag=ac.createGain();al.type='lowpass';al.frequency.value=320;ag.gain.value=.22;

function scooter(){const t=AC.currentTime,d=rand(4,6.5),f=rand(95,130);
  const o=AC.createOscillator(),o2=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain(),p=panner(AC,0);
  o.type='sawtooth';o2.type='square';

  o2.frequency.setValueAtTime(f*.53,t);o2.frequency.linearRampToValueAtTime(f*.47,t+d);

  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(rand(.025,.045),t+d*.5);g.gain.linearRampToValueAtTime(0,t+d);
  if(p.pan){const s=Math.random()<.5?-1:1;p.pan.setValueAtTime(-.8*s,t);p.pan.linearRampToValueAtTime(.8*s,t+d);}
  o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(p);p.connect(SN.master);o.start(t);o2.start(t);o.stop(t+d+.1);o2.stop(t+d+.1);}

  STORIES.forEach((S,i)=>{const caps=S.panels.map(p=>p[1]);
    if(!inCat(S))return;
    if(q&&!S.title.includes(q)&&!caps.some(c=>c.includes(q)))return;n++;
    const li=document.createElement('li'),b=document.createElement('button');b.type='button';
    if(story&&story.S===S)b.setAttribute('aria-current','true');
    b.innerHTML=`<span class="t">〈${hl(S.title,q)}〉<span class="g">${S.cats.join('・')}${S.by?'　投稿：'+esc(S.by):''}</span></span><span class="c">${caps.map(c=>hl(c,q)).join('　')}</span>`;
    b.addEventListener('click',()=>playStory(i));li.append(b);ul.append(li);});
  if(!n){const li=document.createElement('li');li.className='empty';li.textContent=storyCat==='all'?`沒有包含「${q}」的故事。換個字試試。`:`「${storyCat}」裡沒有包含「${q}」的故事。試試「全部」。`;ul.append(li);}}
function playStory(i){closeSheet();storyIdx=i-1;
  if(mode!=='story'){mode='story';document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mode==='story'?'true':'false'));
    $('catseg').hidden=true;$('pick').hidden=false;}
  startMode();}
function renderChips(){const box=$('chips');box.replaceChildren();
  for(const c of ['all',...CATS]){const b=document.createElement('button');b.type='button';
    const k=c==='all'?STORIES.length:STORIES.filter(S=>S.cats.includes(c)).length;
    b.innerHTML=`${c==='all'?'全部':c}<span class="k">${k}</span>`;b.setAttribute('aria-pressed',storyCat===c?'true':'false');
    b.addEventListener('click',()=>{storyCat=c;$('pick').textContent=c==='all'?'找故事':`找故事・${c}`;renderChips();renderList();});box.append(b);}}
function openSheet(){$('sheet').hidden=false;$('q').value='';renderChips();renderList();if(!matchMedia('(pointer:coarse)').matches)setTimeout(()=>{try{$('q').focus();}catch(e){}},30);}
function closeSheet(){$('sheet').hidden=true;$('pick').focus({preventScroll:true});}
$('pick').addEventListener('click',openSheet);
$('sheet-close').addEventListener('click',closeSheet);
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet();});
$('q').addEventListener('input',renderList);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet();if(e.key==='Escape'){$('shareSheet').hidden=true;$('originSheet').hidden=true;}});
showHint();

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused)step(dt*SPEEDS[speedIdx]);render();soundTick();requestAnimationFrame(frame);}
const SHARE_BASE='https://p19691221-web.github.io/soft-shelf/works/shuihen/';
function storyFromHash(){try{const m=location.hash.match(/^#s=(.+)$/);let t=m?decodeURIComponent(m[1]):'';if(!t)t=new URLSearchParams(location.search).get('s')||'';if(!t)return -1;return STORIES.findIndex(S=>S.title===t);}catch(e){return -1;}}
{const i=storyFromHash();if(i>=0)storyIdx=i-1;}
window.addEventListener('hashchange',()=>{const i=storyFromHash();if(i>=0&&!(story&&story.S===STORIES[i]))playStory(i);});
function flash(t){$('hint').textContent=t;$('hint').classList.remove('gone');clearTimeout(hintT);hintT=setTimeout(()=>$('hint').classList.add('gone'),3000);}
function openShare(t,url){$('share-name').textContent=`〈${t}〉`;$('share-url').value=url;
  const txt=`〈${t}〉——一條水管，在老水泥地上畫的四格故事`;
  $('sh-line').href='https://social-plugins.line.me/lineit/share?url='+encodeURIComponent(url);
  $('sh-threads').href='https://www.threads.net/intent/post?text='+encodeURIComponent(txt+'\n'+url);
  $('sh-fb').href='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url);
  $('sh-copy').textContent='複製連結';$('shareSheet').hidden=false;}
$('sh-copy').addEventListener('click',async()=>{const url=$('share-url').value;
  try{await navigator.clipboard.writeText(url);}catch(e){const u=$('share-url');u.focus();u.select();try{document.execCommand('copy');}catch(e2){}}
  $('sh-copy').textContent='已複製 ✓';});
$('share-close').addEventListener('click',()=>{$('shareSheet').hidden=true;});
$('origin').addEventListener('click',()=>{$('originSheet').hidden=false;});
$('origin-close').addEventListener('click',()=>{$('originSheet').hidden=true;});
$('originSheet').addEventListener('click',e=>{if(e.target===$('originSheet'))$('originSheet').hidden=true;});
$('shareSheet').addEventListener('click',e=>{if(e.target===$('shareSheet'))$('shareSheet').hidden=true;});
$('share').addEventListener('click',async()=>{if(!story)return;const t=story.S.title,url=SHARE_BASE+'#s='+encodeURIComponent(t);
  const data={title:`水泥地水痕〈${t}〉`,text:`〈${t}〉——一條水管，在老水泥地上畫的四格故事`,url};
  if(navigator.share&&window.top===window.self){try{await navigator.share(data);return;}catch(e){if(e&&e.name==='AbortError')return;}}
  openShare(t,url);});
resize();requestAnimationFrame(frame);
})();
</script>
