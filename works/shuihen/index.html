<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="老水泥廣場上，一條水管一格一格用水畫出四格故事，畫完一起曬乾；也可以自由模式隨意流。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>水泥地水痕</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* layout: full-bleed concrete plaza on canvas; chalk-written tag top-left; chalk-outlined control strip along the bottom */
:root{
  --chalk:#f7f4ea;
  --chalk-dim:rgba(247,244,234,.74);
  --chalk-line:rgba(247,244,234,.62);
  --scrim:rgba(38,34,29,.38);
  --scrim-on:rgba(247,244,234,.9);
  --ink:#2a2620;
  --ground:#8f897e;
  --font-chalk:"LXGW WenKai TC","Kaiti TC","BiauKai","STKaiti","DFKai-SB",serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--chalk);font-family:var(--font-chalk);overflow:hidden;-webkit-user-select:none;user-select:none}
#plaza{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:crosshair}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
.tag{display:grid;gap:2px;text-shadow:0 1px 0 rgba(0,0,0,.25),0 0 6px rgba(0,0,0,.18)}
.no{font-size:30px;font-weight:700;letter-spacing:.06em;line-height:1.1}
.nm{font-size:19px;line-height:1.3;min-height:1.3em}
.ph{min-height:1.4em}
.ph{font-size:14px;color:var(--chalk-dim);letter-spacing:.12em}
.foot{display:grid;gap:10px;justify-items:start}
.hint{font-size:15px;color:var(--chalk-dim);text-shadow:0 1px 2px rgba(0,0,0,.3);transition:opacity .8s}
.hint.gone{opacity:0}
.bar{pointer-events:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;gap:0}
button{font:inherit;font-size:16px;color:var(--chalk);background:var(--scrim);border:1.5px solid var(--chalk-line);
  border-radius:3px 6px 4px 5px;padding:7px 13px;cursor:pointer;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  min-height:40px;font-variant-numeric:tabular-nums}
button:hover{border-color:var(--chalk)}
button:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.seg button{border-radius:0}
.seg button:first-child{border-radius:4px 0 0 5px}
.seg button:last-child{border-radius:0 5px 4px 0}
.seg button+button{border-left-width:0}
.seg button[aria-pressed="true"]{background:var(--scrim-on);color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,18,15,.5);display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.card{width:min(460px,100%);max-height:78vh;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:12px;
  background:rgba(40,36,30,.94);border:1.5px solid var(--chalk-line);border-radius:4px 7px 5px 6px;padding:16px;box-sizing:border-box}
.card header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2{margin:0;font-size:22px;letter-spacing:.08em}
.card input{font:inherit;font-size:17px;color:var(--chalk);background:transparent;border:0;border-bottom:1.5px solid var(--chalk-line);padding:8px 2px;min-width:0}
.card input:focus-visible{outline:none;border-bottom-color:var(--chalk)}
.card input::placeholder{color:var(--chalk-dim)}
.list{list-style:none;margin:0;padding:0;overflow-y:auto;display:grid;gap:6px;align-content:start}
.list button{width:100%;text-align:left;display:grid;gap:3px;border-radius:3px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.list button[aria-current="true"]{border-color:var(--chalk);background:rgba(247,244,234,.1)}
.list .t{font-size:18px;font-weight:700}
.list .c{font-size:14px;color:var(--chalk-dim);line-height:1.45}
.list mark{background:rgba(247,244,234,.85);color:var(--ink);border-radius:2px;padding:0 1px}
.empty{color:var(--chalk-dim);font-size:15px;padding:6px 2px}
</style>

</head>
<body>
<canvas id="plaza" aria-label="老水泥廣場，一條水管流出的水在地上形成各種造型"></canvas>
<div class="hud">
  <div class="tag" aria-live="polite">
    <div class="no" id="no">第 1 灘</div>
    <div class="nm" id="nm"></div>
    <div class="ph" id="ph">水管移過去</div>
  </div>
  <div class="foot">
    <div class="hint" id="hint">四格故事：水管一格一格畫，畫完一起曬乾</div>
    <div class="bar">
      <button id="pause" type="button">暫停</button>
      <button id="pick" type="button">找故事</button>
      <button id="next" type="button">換下一個</button>
      <button id="speed" type="button">速度 1×</button>
      <button id="sound" type="button" aria-pressed="false">開聲音</button>
      <div class="seg" role="group" aria-label="模式">
        <button type="button" id="m-story" data-mode="story" aria-pressed="true">四格故事</button>
        <button type="button" id="m-free" data-mode="free" aria-pressed="false">自由</button>
      </div>
      <div class="seg" id="catseg" role="group" aria-label="造型種類" hidden>
        <button type="button" id="c-all" data-cat="all" aria-pressed="true">全部</button>
        <button type="button" id="c-p" data-cat="p" aria-pressed="false">人物</button>
        <button type="button" id="c-o" data-cat="o" aria-pressed="false">其他</button>
      </div>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header><h2 id="sheet-title">找故事</h2><button type="button" id="sheet-close">關閉</button></header>
    <input id="q" type="search" placeholder="輸入關鍵字，例如：貓、護身符、阿伯" autocomplete="off">
    <ul class="list" id="list"></ul>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('plaza'), ctx=cv.getContext('2d');
const bg=document.createElement('canvas');
const wc=document.createElement('canvas'), wctx=wc.getContext('2d');
const sc=document.createElement('canvas'), sctx=sc.getContext('2d');
const mc=document.createElement('canvas'), mctx=mc.getContext('2d',{willReadFrequently:true});
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

/* ---------- noise ---------- */
function makeNoise(){const S=256,t=new Float32Array(S*S);for(let i=0;i<t.length;i++)t[i]=Math.random();
  return (x,y)=>{const xi=Math.floor(x),yi=Math.floor(y);let xf=x-xi,yf=y-yi;xf=xf*xf*(3-2*xf);yf=yf*yf*(3-2*yf);
    const x0=xi&255,y0=yi&255,x1=(xi+1)&255,y1=(yi+1)&255;
    const a=t[x0+y0*S],b=t[x1+y0*S],c=t[x0+y1*S],d=t[x1+y1*S];
    return a+(b-a)*xf+(c-a)*yf+(a-b-c+d)*xf*yf;};}
const nz=makeNoise();
const fbm=(x,y)=>nz(x,y)*.6+nz(x*2.1+17,y*2.1+9)*.28+nz(x*4.3+3,y*4.3+41)*.12;

/* ---------- state ---------- */
let W=0,H=0,DPR=1,CELL=3,GW=0,GH=0,N=0;
let acc,accDry,wet,stain,mask,arr,dryT,rough,gloss,depth,queue,heapI,heapK,wImg,sImg;
let anchor={x:-30,y:0},nozzle={x:0,y:0},aimAng=-.4;
let round=null,queuedAt=null,paused=false,speedIdx=0,cat='all',lastName='';
const SPEEDS=[1,2,4];
const FLOW=50;
let parts=[];

/* ---------- shapes (unit space, centred, facing right) ---------- */
function cr(c,P){const n=P.length;c.moveTo(P[0][0],P[0][1]);
  for(let i=0;i<n;i++){const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    c.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]);}
  c.closePath();}
const fillE=(c,x,y,rx,ry,r=0)=>{c.beginPath();c.ellipse(x,y,rx,ry,r,0,Math.PI*2);c.fill();};
const fillP=(c,pts)=>{c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();c.fill();};
const cut=(c,fn)=>{c.globalCompositeOperation='destination-out';fn();c.globalCompositeOperation='source-over';};

const PV=[
  {id:'douli',name:'戴斗笠的阿伯'},{id:'cap',name:'戴鴨舌帽的少年'},{id:'bun',name:'綁髮髻的阿嬤'},
  {id:'pony',name:'綁馬尾的女孩'},{id:'beard',name:'留鬍子的阿公'},{id:'long',name:'長頭髮的人'},
  {id:'kid',name:'仰著頭的小孩'},{id:'flat',name:'理平頭的人'},{id:'plain',name:'路過的人'}
];
function profileShape(v){
  let nose=rand(-.01,.06),lip=rand(0,.02),chin=rand(-.04,.03),brow=rand(0,.025),fore=rand(-.03,.02);
  if(v.fixed){nose=.035;lip=.01;chin=0;brow=.012;fore=0;}
  const P=[[.30,1.10],[.27,.88],[.18,.72],[.10,.48],[.17,.20],[.40,.04],[.62,.08],[.72+fore,.24],[.76+brow,.38],[.745,.45],
    [.80+nose,.58],[.765,.63],[.785+lip,.69],[.76,.725],[.775+lip,.765],[.745,.80],[.765+chin,.88],[.66,.95],[.60,.98],[.60,1.10]];
  if(v.id==='kid'){P[10]=[.775,.58];P[16]=[.735,.87];P[7]=[.76,.25];P[3]=[.06,.46];P[4]=[.13,.16];P[5]=[.38,.0];P[8]=[.765,.38];}
  if(v.id==='flat'){P[4]=[.18,.13];P[5]=[.40,.07];P[6]=[.64,.07];}
  if(v.id==='long'){P[0]=[.26,1.12];P[1]=[.06,1.04];P[2]=[.04,.78];}
  return {name:v.name,kind:'p',core:v.core||[0,.02],box:v.box||[1.07,1.12],rot:v.id==='kid'?-.14:rand(-.04,.04),
    cut:v.cutP?(c=>{if(v.scale){c.translate(v.shift||0,0);c.scale(v.scale,v.scale);}c.translate(-.45,-.57);v.cutP(c);}):undefined,draw(c){
    if(v.scale){c.translate(v.shift||0,0);c.scale(v.scale,v.scale);}
    c.translate(-.45,-.57);if(v.extra)v.extra(c);
    c.beginPath();cr(c,P);c.fill();
    if(v.id==='bun'||v.bun){fillE(c,.12,.22,.125,.12);}
    if(v.id==='mom'){fillE(c,.12,.6,.11,.1);}
    if(v.id==='pony'){c.lineWidth=.1;c.beginPath();c.moveTo(.16,.30);c.quadraticCurveTo(-.08,.36,-.06,.68);c.stroke();fillE(c,.15,.30,.06,.06);}
    if(v.id==='cap'){fillE(c,.42,.18,.33,.16);fillP(c,[[.55,.12],[1.0,.18],[.99,.235],[.6,.25]]);}
    if(v.id==='douli'){fillP(c,[[-.16,.34],[.43,-.13],[1.02,.34],[.98,.37],[-.12,.37]]);
      c.lineWidth=.03;c.beginPath();c.moveTo(.70,.36);c.quadraticCurveTo(.76,.80,.62,.96);c.stroke();}
    if(v.id==='beard'){c.beginPath();cr(c,[[.79,.77],[.81,.90],[.73,1.05],[.58,1.07],[.50,.92],[.62,.84]]);c.fill();}
  }};
}

function carBody(c){c.beginPath();c.moveTo(-.48,.05);c.lineTo(-.47,-.04);c.quadraticCurveTo(-.42,-.08,-.3,-.09);c.lineTo(-.17,-.1);
  c.quadraticCurveTo(-.04,-.23,.12,-.2);c.quadraticCurveTo(.25,-.14,.33,-.08);c.lineTo(.46,-.04);c.quadraticCurveTo(.51,-.01,.49,.05);
  c.lineTo(.42,.08);c.lineTo(-.42,.08);c.closePath();c.fill();fillE(c,-.29,.08,.095,.095);fillE(c,.29,.08,.095,.095);}
function carCut(c){c.beginPath();c.moveTo(-.11,-.11);c.quadraticCurveTo(0,-.19,.11,-.175);c.quadraticCurveTo(.19,-.13,.22,-.1);c.lineTo(-.11,-.1);c.closePath();c.fill();
  fillE(c,-.29,.08,.035,.035);fillE(c,.29,.08,.035,.035);}
const OTHERS=[
  {name:'坐著的貓',core:[0,.15],draw(c){fillE(c,0,.15,.27,.33);fillE(c,.1,-.27,.17,.17);
    fillP(c,[[-.03,-.33],[-.01,-.53],[.11,-.40]]);fillP(c,[[.13,-.40],[.25,-.53],[.27,-.31]]);
    fillE(c,.13,.46,.13,.045);c.lineWidth=.075;c.beginPath();c.moveTo(-.18,.44);c.quadraticCurveTo(-.5,.44,-.43,.06);c.stroke();}},
  {name:'白鷺鷥',core:[-.02,.02],draw(c){fillE(c,-.02,.02,.24,.115,-.25);fillP(c,[[-.2,.05],[-.4,.15],[-.18,.13]]);
    c.lineWidth=.055;c.beginPath();c.moveTo(.15,-.03);c.bezierCurveTo(.30,-.18,-.02,-.25,.10,-.39);c.stroke();
    fillE(c,.13,-.41,.05,.045);fillP(c,[[.16,-.43],[.36,-.385],[.16,-.375]]);
    c.lineWidth=.032;c.beginPath();c.moveTo(.0,.08);c.lineTo(.02,.48);c.moveTo(.06,.08);c.lineTo(.12,.47);
    c.moveTo(-.04,.48);c.lineTo(.08,.48);c.moveTo(.06,.47);c.lineTo(.18,.47);c.stroke();}},
  {name:'一條魚',core:[0,0],draw(c){fillE(c,.03,0,.34,.15);fillP(c,[[-.26,0],[-.48,-.18],[-.42,0],[-.48,.18]]);
    fillP(c,[[-.06,-.12],[.06,-.25],[.16,-.12]]);fillP(c,[[-.02,.12],[.06,.21],[.1,.12]]);
    cut(c,()=>{fillE(c,.24,-.035,.028,.028);c.lineWidth=.022;c.beginPath();c.moveTo(.14,-.11);c.quadraticCurveTo(.08,0,.14,.11);c.stroke();});}},
  {name:'一片葉子',core:[0,0],draw(c){c.beginPath();c.moveTo(-.45,.05);c.quadraticCurveTo(-.05,-.44,.46,-.05);c.quadraticCurveTo(.05,.38,-.45,.05);c.fill();
    c.lineWidth=.035;c.beginPath();c.moveTo(-.44,.05);c.quadraticCurveTo(-.54,.1,-.6,.2);c.stroke();
    cut(c,()=>{c.lineWidth=.024;c.beginPath();c.moveTo(-.38,.045);c.lineTo(.36,-.04);
      for(let k=0;k<4;k++){const x=-.22+k*.16,y=.03-k*.018;c.moveTo(x,y);c.lineTo(x+.11,y-.13+k*.01);c.moveTo(x,y);c.lineTo(x+.1,y+.12-k*.015);}c.stroke();});}},
  {name:'慢慢爬的蝸牛',core:[0,-.06],draw(c){fillE(c,.02,.17,.38,.07);fillE(c,.34,.07,.07,.12,.35);fillE(c,0,-.07,.24,.24);
    c.lineWidth=.026;c.beginPath();c.moveTo(.35,-.02);c.lineTo(.39,-.21);c.moveTo(.31,-.02);c.lineTo(.27,-.19);c.stroke();
    fillE(c,.39,-.22,.028,.028);fillE(c,.27,-.2,.028,.028);
    cut(c,()=>{c.lineWidth=.03;c.beginPath();for(let a=0;a<4.6*Math.PI;a+=.15){const r=.015+a*.013;const x=r*Math.cos(a),y=-.07+r*Math.sin(a);a===0?c.moveTo(x,y):c.lineTo(x,y);}c.stroke();});}},
  {name:'飛過的鳥',core:[0,.07],draw(c){c.beginPath();c.moveTo(-.48,-.08);c.quadraticCurveTo(-.22,-.3,0,.0);c.quadraticCurveTo(.22,-.3,.48,-.08);
    c.quadraticCurveTo(.2,-.06,.02,.16);c.quadraticCurveTo(-.2,-.06,-.48,-.08);c.fill();fillE(c,.01,.08,.06,.09);}},
  {name:'護身符',rot:0,core:[0,.1],draw(c){
    c.beginPath();c.moveTo(-.28,-.16);c.quadraticCurveTo(0,-.3,.28,-.16);c.lineTo(.28,.36);c.quadraticCurveTo(.28,.42,.22,.42);c.lineTo(-.22,.42);c.quadraticCurveTo(-.28,.42,-.28,.36);c.closePath();c.fill();
    c.lineWidth=.04;c.beginPath();c.ellipse(0,-.36,.07,.1,0,0,7);c.stroke();fillE(c,0,-.24,.05,.045);
    c.lineWidth=.035;c.beginPath();c.moveTo(-.02,-.22);c.quadraticCurveTo(-.1,-.12,-.08,-.04);c.moveTo(.02,-.22);c.quadraticCurveTo(.1,-.12,.08,-.04);c.stroke();},
   cut(c){c.save();c.scale(.01,.01);c.font='900 26px "Noto Serif CJK TC","PMingLiU","Songti TC","LXGW WenKai TC",serif';c.textAlign='center';c.textBaseline='middle';
    c.fillText('平',0,3);c.fillText('安',0,29);c.restore();}},
  {name:'交到手上',rot:0,core:[.06,.17],draw(c){
    c.scale(.84,.84);c.lineWidth=.17;c.beginPath();c.moveTo(-.56,-.46);c.lineTo(-.24,-.22);c.stroke();
    fillE(c,-.17,-.16,.15,.11,.55);
    c.lineWidth=.05;c.beginPath();
    for(const [x,y,ex,ey] of [[-.1,-.24,.06,-.17],[-.06,-.19,.09,-.1],[-.06,-.13,.07,-.03],[-.09,-.08,.02,.01]]){c.moveTo(x,y);c.quadraticCurveTo((x+ex)/2+.02,(y+ey)/2-.02,ex,ey);}
    c.moveTo(-.2,-.08);c.quadraticCurveTo(-.12,-.02,-.04,-.02);c.stroke();
    c.lineWidth=.05;c.beginPath();c.moveTo(.06,-.06);c.lineTo(.07,.1);c.stroke();
    c.beginPath();c.moveTo(.0,.09);c.lineTo(.14,.09);c.lineTo(.14,.3);c.lineTo(.0,.3);c.closePath();c.fill();
    c.lineWidth=.16;c.beginPath();c.moveTo(.58,.46);c.lineTo(.3,.33);c.stroke();
    fillE(c,.17,.31,.16,.075,.12);
    c.lineWidth=.048;c.beginPath();
    for(const [x,y,ex,ey] of [[.04,.29,-.13,.2],[.04,.33,-.15,.27],[.05,.37,-.13,.33],[.07,.4,-.09,.38]]){c.moveTo(x,y);c.quadraticCurveTo((x+ex)/2,(y+ey)/2+.04,ex,ey);}
    c.moveTo(.2,.25);c.quadraticCurveTo(.16,.17,.1,.15);c.stroke();}},
  {name:'背著背包的孩子',rot:0,core:[.05,-.1],draw(c){
    fillE(c,.13,-.36,.095,.095);
    c.lineWidth=.14;c.beginPath();c.moveTo(.1,-.24);c.lineTo(.05,.06);c.stroke();
    c.beginPath();c.moveTo(-.16,-.27);c.lineTo(.0,-.27);c.lineTo(.0,.03);c.lineTo(-.16,.03);c.closePath();c.fill();
    c.lineWidth=.06;c.beginPath();c.moveTo(.11,-.19);c.quadraticCurveTo(.2,-.08,.24,.02);c.stroke();
    c.lineWidth=.075;c.beginPath();c.moveTo(.06,.06);c.quadraticCurveTo(.16,.22,.22,.44);c.moveTo(.03,.06);c.quadraticCurveTo(-.04,.24,-.16,.42);c.stroke();
    c.lineWidth=.05;c.beginPath();c.moveTo(.2,.45);c.lineTo(.3,.45);c.moveTo(-.18,.42);c.lineTo(-.1,.45);c.stroke();
    c.lineWidth=.02;c.beginPath();c.moveTo(-.16,0);c.lineTo(-.2,.08);c.stroke();
    c.beginPath();c.moveTo(-.25,.08);c.lineTo(-.15,.08);c.lineTo(-.15,.18);c.lineTo(-.25,.18);c.closePath();c.fill();}},
  {name:'一台新車',rot:0,core:[0,0],draw(c){carBody(c);},cut(c){carCut(c);}},
  {name:'倒過來的車',rot:0,core:[-.44,.3],draw(c){
    c.lineWidth=.075;c.beginPath();c.moveTo(-.46,.46);c.lineTo(-.44,.1);c.arc(0,.08,.44,Math.PI,Math.PI*2.02,false);c.lineTo(.46,.46);c.stroke();
    c.save();c.translate(0,-.25);c.rotate(Math.PI);c.scale(.66,.66);carBody(c);c.restore();},
   cut(c){c.save();c.translate(0,-.25);c.rotate(Math.PI);c.scale(.66,.66);carCut(c);c.restore();}},
  {name:'噴氣翻身的車',rot:0,core:[.05,-.05],draw(c){
    c.save();c.translate(.08,-.08);c.rotate(-.75);c.scale(.8,.8);carBody(c);c.restore();

  const toA=Math.atan2(cy-ny,cx-nx),dist=Math.hypot(nx-nozzle.x,ny-nozzle.y);
  round={sh,sPx,cx,cy,nx,ny,toA,flip,rot:opt.rot??(sh.rot||0),rect:opt.rect||null,k:opt.k??-1,phase:'move',t:0,F:0,
    fromX:nozzle.x,fromY:nozzle.y,fromA:aimAng,moveDur:clamp(dist/260,.5,1.8),maxArr:0,maxDry:0};
  prepareMask(round);
  if(!opt.keepAcc)acc.fill(0);
  const lag=(round.k>0?round.k*1.4:0)+(opt.lag||0);
  for(let i=0;i<N;i++)if(mask[i]){acc[i]=1;accDry[i]=dryT[i]+lag;}
  if(!opt.rect)freeCount++;

}
function label(){
  if(round.rect&&story){$('no').textContent=`〈${story.S.title}〉`;$('nm').textContent=`第 ${round.k+1} 格，共 4 格`;}
  else{$('no').textContent=`第 ${freeCount} 灘`;$('nm').textContent=round.sh.name;}
  lastPh='';setPhase();
}
const PH={move:'水管移過去',flow:'水流中',hold:'漫開了',dry:'正在乾',rest:'乾了'};
let lastPh='';
function setPhase(){const p=PH[round.phase];if(p!==lastPh){$('ph').textContent=p;lastPh=p;}}
function angLerp(a,b,k){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return a+d*k;}
function accMaxDry(){let m=0;for(let i=0;i<N;i++)if(acc[i]&&accDry[i]>m)m=accDry[i];return m;}

function step(dt){
  const r=round,inStory=!!r.rect&&!!story;r.t+=dt;
  chalkA=inStory?(r.phase==='rest'?Math.max(0,chalkA-dt/1.2):Math.min(1,chalkA+dt*.8)):Math.max(0,chalkA-dt);
  if(inStory)for(let k=0;k<=r.k;k++)if(k<r.k||r.phase!=='move')story.capA[k]=Math.min(1,story.capA[k]+dt*1.2);
  if(r.phase==='move'){const k=ease(clamp(r.t/r.moveDur,0,1));nozzle.x=lerp(r.fromX,r.nx,k);nozzle.y=lerp(r.fromY,r.ny,k);aimAng=angLerp(r.fromA,r.toA,k);
    if(r.t>=r.moveDur){r.phase='flow';r.t=0;}}
  else if(r.phase==='flow'){r.F+=dt*FLOW;if(r.F>r.maxArr+14){r.phase='hold';r.t=0;}}
  else if(r.phase==='hold'){r.F+=dt*FLOW;
    if(inStory&&r.k<3){if(r.t>1){startPanel(r.k+1);return;}}
    else if(r.t>(inStory?3:2.4)){r.maxDry=accMaxDry();r.phase='dry';r.t=0;}}
  else if(r.phase==='dry'){if(r.t>r.maxDry+1.6){r.phase='rest';r.t=0;}}
  else if(r.phase==='rest'){if(r.t>(inStory?1.8:.9)){
    if(mode==='story')planStory();else{const at=queuedAt;queuedAt=null;planRound({at});}return;}}
  setPhase();
  const ph=r.phase,F=r.F,td=r.t,kW=Math.min(1,dt*5),kD=dt*.8,kR=dt*1.4,sd=Math.exp(-dt/50);
  const wetting=ph==='flow'||ph==='hold',drying=ph==='dry';
  for(let i=0;i<N;i++){let w=wet[i];
    if(acc[i]){
      if(drying){if(td>accDry[i]&&w>0){if(w>.4&&stain[i]<.1)stain[i]=.1;w-=kD;}}
      else if(wetting&&mask[i]&&arr[i]<F)w+=(1-w)*kW;
    }else if(w>0){if(w>.4&&stain[i]<.08)stain[i]=.08;w-=kR;}
    wet[i]=w<0?0:w;stain[i]*=sd;}
  // splashes
  if(wetting){const ax=Math.cos(aimAng),ay=Math.sin(aimAng),tx=nozzle.x+ax*12,ty=nozzle.y+ay*12;
    const n=Math.floor(dt*40+Math.random());for(let k=0;k<n;k++){const a=aimAng+rand(-1.6,1.6),sp=rand(15,70);
      parts.push({x:tx+ax*rand(2,10),y:ty+ay*rand(2,10),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:rand(.2,.5),m:0,s:rand(.8,2)});}}
  else if(drying&&td<3&&Math.random()<dt*2.5){const ax=Math.cos(aimAng),ay=Math.sin(aimAng);
    parts.push({x:nozzle.x+ax*12,y:nozzle.y+ay*12,vx:0,vy:0,l:.6,m:0,s:2.2});drip();}
  for(const p of parts){p.m+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92;}
  parts=parts.filter(p=>p.m<p.l);
}

/* ---------- chalk frames & captions ---------- */
let chalk=null,chx=null,speck=null;
function buildChalk(){chalk=document.createElement('canvas');chalk.width=Math.round(W*DPR);chalk.height=Math.round(H*DPR);chx=chalk.getContext('2d');
  const t=document.createElement('canvas');t.width=t.height=96;const x=t.getContext('2d');
  for(let k=0;k<900;k++){x.fillStyle=`rgba(0,0,0,${Math.random().toFixed(2)})`;x.fillRect(Math.random()*96,Math.random()*96,1+Math.random()*1.4,1);}
  speck=chx.createPattern(t,'repeat');}
function chalkLine(x1,y1,x2,y2,j){chx.beginPath();chx.moveTo(x1+j[0],y1+j[1]);chx.quadraticCurveTo((x1+x2)/2+j[2],(y1+y2)/2+j[3],x2+j[4],y2+j[5]);chx.stroke();}
function wrapChalk(t,x,y,maxW,lh){const lines=[];let cur='';
  for(const ch of t){if(cur&&!'，。！？、）」：…'.includes(ch)&&chx.measureText(cur+ch).width>maxW){lines.push(cur);cur=ch;}else cur+=ch;}
  if(cur)lines.push(cur);
  if(lines.length>2){lines[1]=lines.slice(1).join('');}
  lines.slice(0,2).forEach((l,i)=>chx.fillText(l,x,y+i*lh,maxW));}
function drawChalkLayer(){
  if(chalkA<=.01||!story)return;
  chx.setTransform(DPR,0,0,DPR,0,0);chx.clearRect(0,0,W,H);
  const {rects,fsz}=story.L,face='"LXGW WenKai TC","Kaiti TC","BiauKai",serif';
  chx.lineCap='round';chx.textBaseline='top';
  rects.forEach((p,k)=>{const j=story.jit[k];
    for(const [col,o] of [['rgba(30,27,23,.3)',1.2],['rgba(247,244,234,.88)',0]]){
      chx.strokeStyle=col;chx.lineWidth=2.4;chx.save();chx.translate(o,o);
      chalkLine(p.x,p.y,p.x+p.w,p.y,j.slice(0,6));chalkLine(p.x+p.w,p.y,p.x+p.w,p.y+p.h,j.slice(6,12));
      chalkLine(p.x+p.w,p.y+p.h,p.x,p.y+p.h,j.slice(12,18));chalkLine(p.x,p.y+p.h,p.x,p.y,j.slice(18,24));
      chx.fillStyle=col;chx.font=`700 ${Math.round(fsz*1.1)}px ${face}`;chx.fillText(String(k+1),p.x+8,p.y+6);
      const a=story.capA[k];
      if(a>0){chx.globalAlpha=a;chx.font=`${Math.round(fsz)}px ${face}`;wrapChalk(story.S.panels[k][1],p.x+2,p.y+p.h+8,p.w-4,fsz*1.45);chx.globalAlpha=1;}
      chx.restore();}
  });
  chx.globalCompositeOperation='destination-out';chx.globalAlpha=.45;chx.fillStyle=speck;chx.fillRect(0,0,W,H);
  chx.globalAlpha=1;chx.globalCompositeOperation='source-over';
  ctx.save();ctx.globalAlpha=chalkA;ctx.drawImage(chalk,0,0,W,H);ctx.restore();
}

/* ---------- render ---------- */
function render(){
  const r=round,ph=r.phase,F=r.F,wetting=ph==='flow'||ph==='hold';
  const standing=wetting?1:ph==='dry'?Math.max(.15,1-r.t/2.5):.15;
  const wd=wImg.data,sd=sImg.data;
  for(let i=0,j=0;i<N;i++,j+=4){const w=wet[i];let d=w*.8+stain[i];
    if(w>.25){const x=i%GW;const l=x?wet[i-1]:w,rr=x<GW-1?wet[i+1]:w,u=i>=GW?wet[i-GW]:w,dn=i+GW<N?wet[i+GW]:w;
      if(Math.min(l,rr,u,dn)<.15)d+=.2;}
    if(d>1)d=1;
    wd[j]=255-d*150;wd[j+1]=255-d*141;wd[j+2]=255-d*126;wd[j+3]=255;
    let g=0;
    if(w>.05){g=w*standing*(.04+gloss[i]*.17);if(wetting){const f=F-arr[i];if(f>=0&&f<16)g+=(1-f/16)*.42*w;}}
    if(g>1)g=1;
    sd[j]=g*206;sd[j+1]=g*219;sd[j+2]=g*232;sd[j+3]=255;}
  wctx.putImageData(wImg,0,0);sctx.putImageData(sImg,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';
  ctx.drawImage(bg,0,0,W,H);
  ctx.imageSmoothingEnabled=true;
  ctx.globalCompositeOperation='multiply';ctx.drawImage(wc,0,0,GW*CELL,GH*CELL);
  ctx.globalCompositeOperation='screen';ctx.drawImage(sc,0,0,GW*CELL,GH*CELL);
  ctx.globalCompositeOperation='source-over';
  drawChalkLayer();
  drawHose(wetting);
  for(const p of parts){const a=1-p.m/p.l;ctx.fillStyle=`rgba(238,245,250,${(a*.8).toFixed(3)})`;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();}
}
function drawHose(running){
  const ax=Math.cos(aimAng),ay=Math.sin(aimAng);
  const p3x=nozzle.x-ax*14,p3y=nozzle.y-ay*14;
  const dd=Math.hypot(p3x-anchor.x,p3y-anchor.y),pull=Math.min(170,dd*.45);
  const c1x=anchor.x+Math.min(W*.3,dd*.5),c1y=anchor.y-Math.min(H*.08,dd*.2),c2x=p3x-ax*pull,c2y=p3y-ay*pull;
  const path=(o)=>{ctx.beginPath();ctx.moveTo(anchor.x+o,anchor.y+o*1.5);ctx.bezierCurveTo(c1x+o,c1y+o*1.5,c2x+o,c2y+o*1.5,p3x+o,p3y+o*1.5);};
  ctx.lineCap='round';
  path(3);ctx.strokeStyle='rgba(28,24,20,.26)';ctx.lineWidth=12;ctx.stroke();
  path(0);ctx.strokeStyle='#1e5331';ctx.lineWidth=11;ctx.stroke();
  ctx.strokeStyle='#33834f';ctx.lineWidth=7.5;ctx.stroke();
  path(-1.6);ctx.strokeStyle='rgba(214,250,222,.38)';ctx.lineWidth=2;ctx.stroke();
  // brass nozzle
  ctx.save();ctx.translate(p3x,p3y);ctx.rotate(aimAng);
  ctx.fillStyle='rgba(28,24,20,.28)';ctx.fillRect(2,-2.5,16,10);
  ctx.fillStyle='#8f6d2f';ctx.fillRect(-2,-5.5,7,11);
  ctx.fillStyle='#c39d52';ctx.fillRect(4,-4.5,11,9);
  ctx.fillStyle='rgba(255,240,200,.5)';ctx.fillRect(4,-3.6,11,1.6);
  ctx.fillStyle='#7a5b26';ctx.fillRect(13,-4.8,2.5,9.6);
  if(running){const l=rand(9,15);ctx.strokeStyle='rgba(232,242,248,.75)';ctx.lineWidth=rand(3,4.5);ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(15+l,rand(-.8,.8));ctx.stroke();}
  ctx.restore();
}

/* ---------- sound (all synthesized live) ---------- */
let AC=null,SN=null,soundOn=false;
function mkNoise(ac,kind){const len=ac.sampleRate*3,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='brown'){last=(last+.02*w)/1.02;d[i]=last*3.5;}else d[i]=w;}
  const s=ac.createBufferSource();s.buffer=b;s.loop=true;s.start(0,Math.random()*2);return s;}
function panner(ac,v){if(!ac.createStereoPanner)return ac.createGain();const p=ac.createStereoPanner();p.pan.value=v;return p;}
function initSound(){
  const ac=new (window.AudioContext||window.webkitAudioContext)();AC=ac;
  const master=ac.createGain(),comp=ac.createDynamicsCompressor();master.gain.value=0;master.connect(comp);comp.connect(ac.destination);
  // hose: two bands of hiss plus a spattering top layer
  const wn=mkNoise(ac,'white'),b1=ac.createBiquadFilter(),b2=ac.createBiquadFilter(),g1=ac.createGain(),g2=ac.createGain(),wg=ac.createGain();
  b1.type='bandpass';b1.frequency.value=1100;b1.Q.value=.9;b2.type='bandpass';b2.frequency.value=3200;b2.Q.value=1.2;
  g1.gain.value=.9;g2.gain.value=.4;wg.gain.value=0;
  wn.connect(b1);wn.connect(b2);b1.connect(g1);b2.connect(g2);g1.connect(wg);g2.connect(wg);wg.connect(master);
  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.37;lg.gain.value=180;lfo.connect(lg);lg.connect(b1.frequency);lfo.start();
  const sp=mkNoise(ac,'white'),hp=ac.createBiquadFilter(),spg=ac.createGain(),spOut=ac.createGain();
  hp.type='highpass';hp.frequency.value=4200;spg.gain.value=.12;spOut.gain.value=0;
  const mod=mkNoise(ac,'brown'),mg=ac.createGain();mg.gain.value=.3;mod.connect(mg);mg.connect(spg.gain);
  sp.connect(hp);hp.connect(spg);spg.connect(spOut);spOut.connect(master);
  // cicadas: bandpassed noise pulsed at a few dozen Hz
  const cicada=(f,rate,pan)=>{const n=mkNoise(ac,'white'),bp=ac.createBiquadFilter(),am=ac.createGain(),o=ac.createOscillator(),og=ac.createGain(),out=ac.createGain(),p=panner(ac,pan);
    bp.type='bandpass';bp.frequency.value=f;bp.Q.value=5;am.gain.value=.5;o.type='triangle';o.frequency.value=rate;og.gain.value=.5;
    o.connect(og);og.connect(am.gain);o.start();out.gain.value=.03;n.connect(bp);bp.connect(am);am.connect(out);out.connect(p);p.connect(master);return out;};
  const cic=[cicada(5400,46,-.5),cicada(6100,53,.6)];
  // distant town hum
  const an=mkNoise(ac,'brown'),al=ac.createBiquadFilter(),ag=ac.createGain();al.type='lowpass';al.frequency.value=320;ag.gain.value=.22;
  an.connect(al);al.connect(ag);ag.connect(master);
  master.gain.setTargetAtTime(.8,ac.currentTime,.6);
  SN={master,wg,spOut,cic,nextSwell:0,nextScooter:ac.currentTime+rand(6,16),water:-1};
}
function scooter(){const t=AC.currentTime,d=rand(4,6.5),f=rand(95,130);
  const o=AC.createOscillator(),o2=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain(),p=panner(AC,0);
  o.type='sawtooth';o2.type='square';
  o.frequency.setValueAtTime(f*1.06,t);o.frequency.linearRampToValueAtTime(f*.94,t+d);
  o2.frequency.setValueAtTime(f*.53,t);o2.frequency.linearRampToValueAtTime(f*.47,t+d);
  lp.type='lowpass';lp.frequency.value=420;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(rand(.025,.045),t+d*.5);g.gain.linearRampToValueAtTime(0,t+d);
  if(p.pan){const s=Math.random()<.5?-1:1;p.pan.setValueAtTime(-.8*s,t);p.pan.linearRampToValueAtTime(.8*s,t+d);}
  o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(p);p.connect(SN.master);o.start(t);o2.start(t);o.stop(t+d+.1);o2.stop(t+d+.1);}
function drip(){if(!AC||!soundOn||AC.state!=='running')return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),f=rand(900,1500);
  o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.45,t+.08);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.004);g.gain.exponentialRampToValueAtTime(.001,t+.14);
  o.connect(g);g.connect(SN.master);o.start(t);o.stop(t+.16);}
function soundTick(){if(!AC||!soundOn||AC.state!=='running')return;const t=AC.currentTime,ph=round.phase;
  const target=(ph==='flow'||ph==='hold')?.55:0;
  if(target!==SN.water){SN.water=target;SN.wg.gain.setTargetAtTime(target,t,target?.25:.6);SN.spOut.gain.setTargetAtTime(target?.5:0,t,target?.3:.5);}
  if(t>SN.nextSwell){for(const c of SN.cic)c.gain.setTargetAtTime(Math.random()<.2?0:rand(.015,.07),t,rand(1.5,3));SN.nextSwell=t+rand(6,14);}
  if(t>SN.nextScooter){scooter();SN.nextScooter=t+rand(18,45);}}

function hl(t,q){const e=esc(t);if(!q)return e;const qe=esc(q);return e.split(qe).join('<mark>'+qe+'</mark>');}

    if(story&&story.S===S)b.setAttribute('aria-current','true');
    b.innerHTML=`<span class="t">〈${hl(S.title,q)}〉</span><span class="c">${caps.map(c=>hl(c,q)).join('　')}</span>`;
    b.addEventListener('click',()=>playStory(i));li.append(b);ul.append(li);});
  if(!n){const li=document.createElement('li');li.className='empty';li.textContent=`沒有包含「${q}」的故事。換個字試試。`;ul.append(li);}}
function playStory(i){closeSheet();storyIdx=i-1;
  if(mode!=='story'){mode='story';document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mode==='story'?'true':'false'));
    $('catseg').hidden=true;$('pick').hidden=false;}
  startMode();}
function openSheet(){$('sheet').hidden=false;$('q').value='';renderList();setTimeout(()=>{try{$('q').focus();}catch(e){}},30);}
function closeSheet(){$('sheet').hidden=true;$('pick').focus({preventScroll:true});}
$('pick').addEventListener('click',openSheet);
$('sheet-close').addEventListener('click',closeSheet);
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet();});
$('q').addEventListener('input',renderList);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet();});
showHint();

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused)step(dt*SPEEDS[speedIdx]);render();soundTick();requestAnimationFrame(frame);}
resize();requestAnimationFrame(frame);
})();
</script>
