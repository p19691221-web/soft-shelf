const $=id=>document.getElementById(id);
const total=BOOK.reduce((n,c)=>n+c.i.length,0);
$('sub').textContent=`${total} 則冷笑話，分成 ${BOOK.length} 章。點一下題目，看答案。`;
let cur=0;
function tabs(){ $('tabs').innerHTML=BOOK.map((c,k)=>`<button class="tab" data-k="${k}" aria-current="${k===cur}">${c.t}<small>${c.i.length}</small></button>`).join(''); }
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function ans(a,word){a=esc(a);return word?a.replace(/^(\S)(（.*）)?$/,(m,ch,ex)=>ch+(ex?`<small>${ex}</small>`:'')):a.replace(/（[^）]*）/g,m=>`<mark>${m}</mark>`);}
function show(k,scroll){cur=k;const c=BOOK[k];tabs();
  const word=c.id==='word';
  $('main').innerHTML=`<div class="chap"><h2>${c.t}</h2><p>${c.s}</p></div>
  <div class="tools"><button id="openAll">全部翻開</button><button id="closeAll">全部蓋上</button></div>
  <div class="list ${word?'grid':''}">${c.i.map((x,n)=>`<button class="slip" aria-expanded="false"><span class="no">${c.t}・${String(n+1).padStart(3,'0')}</span><span class="q">${esc(x[0])}${word?'<br><small style="color:var(--muted);font-size:12px">打一字</small>':''}</span><span class="a">${ans(x[1],word)}</span>${x[2]?`<span class="by">讀者投稿：${esc(x[2])}</span>`:''}<span class="hint">點一下看答案</span></button>`).join('')}</div>
  <div class="pager"><button id="prev" ${k?'':'hidden'}>← ${k?BOOK[k-1].t:''}</button><span></span><button id="next" ${k<BOOK.length-1?'':'hidden'}>${k<BOOK.length-1?BOOK[k+1].t:''} →</button></div>`;
  if(word)document.querySelectorAll('.grid .slip .q small').forEach(e=>e.remove());
  const t=document.querySelector(`.tab[data-k="${k}"]`);t&&t.scrollIntoView({inline:'center',block:'nearest'});
  if(scroll)window.scrollTo({top:0});
  if(location.hash.slice(1)!==c.id)history.replaceState(null,'','#'+c.id);
  try{localStorage.setItem('jb-ch',c.id)}catch(e){}
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)show(+b.dataset.k,true)});
$('main').addEventListener('click',e=>{
  const s=e.target.closest('.slip');if(s){const o=s.classList.toggle('open');s.setAttribute('aria-expanded',o);return}
  if(e.target.id==='openAll'||e.target.id==='closeAll'){const o=e.target.id==='openAll';document.querySelectorAll('.slip').forEach(s=>{s.classList.toggle('open',o);s.setAttribute('aria-expanded',o)});}
  if(e.target.closest('#prev'))show(cur-1,true);if(e.target.closest('#next'))show(cur+1,true);
});
function fromHash(){const id=location.hash.slice(1);const k=BOOK.findIndex(c=>c.id===id);return k}
window.addEventListener('hashchange',()=>{const k=fromHash();if(k>=0&&k!==cur)show(k,true)});
let start=fromHash();if(start<0){try{const id=localStorage.getItem('jb-ch');start=BOOK.findIndex(c=>c.id===id)}catch(e){}}
show(Math.max(0,start),false);
// random
function draw(){const k=Math.floor(Math.random()*BOOK.length);const c=BOOK[k];const x=c.i[Math.floor(Math.random()*c.i.length)];
  $('rfrom').textContent=c.t+(c.id==='word'?'・打一字':'');$('rq').textContent=x[0];$('ra').textContent=x[1]+(x[2]?`\n\n讀者投稿：${x[2]}`:'');$('ra').hidden=true;$('rbtn').hidden=false;$('sheet').hidden=false;$('rbtn').focus();}
$('draw').onclick=draw;$('rnext').onclick=draw;
$('rbtn').onclick=()=>{$('ra').hidden=false;$('rbtn').hidden=true;$('rnext').focus()};
$('rclose').onclick=()=>{$('sheet').hidden=true};
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('sheet').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('sheet').hidden=true});
</script>
